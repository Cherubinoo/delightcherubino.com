name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # ── Stage 1: CI ─────────────────────────────────────────────────────────────
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Frontend checks
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      # Backend checks
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          pip install -r requirements.txt

      - name: Check Django syntax
        working-directory: ./backend
        run: |
          python -m compileall . -q

  # ── Stage 2: CD ─────────────────────────────────────────────────────────────
  cd:
    name: Deploy to Production
    runs-on: self-hosted
    needs: ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write .env file
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
        run: |
          cat > /home/administrator/prod/delightcherubino/backend/.env <<EOF
          SECRET_KEY=${SECRET_KEY}
          DEBUG=False
          ALLOWED_HOSTS=${ALLOWED_HOSTS}
          DB_NAME=${DB_NAME}
          DB_USER=${DB_USER}
          DB_PASSWORD=${DB_PASSWORD}
          DB_HOST=${DB_HOST}
          DB_PORT=${DB_PORT}
          CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
          STATIC_ROOT=/home/administrator/prod/delightcherubino/backend/staticfiles
          EOF

      - name: Deploy
        run: /home/administrator/prod/delightcherubino/deploy.sh
